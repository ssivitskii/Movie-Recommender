<text x="96" y="252" font-size="25" fill="#FAF5E5" font-weight="650" >Time boundaries</text>
<text x="96" y="280" font-size="20" fill="#C6BA9A" font-weight="400" >70 / 15 / 15 groups</text>
<text x="96" y="304" font-size="20" fill="#C6BA9A" font-weight="400" >Equal timestamps together</text>
<path d="M300 323V337" fill="none" stroke="#E4BF68" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="342" width="540" height="100" rx="12" fill="#333022" stroke="#514830"/>
<text x="51" y="373" font-size="16" fill="#E4BF68" font-weight="700" >03</text>
<text x="96" y="374" font-size="25" fill="#FAF5E5" font-weight="650" >Fit &amp; validate</text>
<text x="96" y="402" font-size="20" fill="#C6BA9A" font-weight="400" >Popularity / cosine / SVD</text>
<text x="96" y="426" font-size="20" fill="#C6BA9A" font-weight="400" >Refit on train + valid</text>
<path d="M300 445V459" fill="none" stroke="#E4BF68" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="464" width="540" height="100" rx="12" fill="#333022" stroke="#514830"/>
<text x="51" y="495" font-size="16" fill="#E4BF68" font-weight="700" >04</text>
<text x="96" y="496" font-size="25" fill="#FAF5E5" font-weight="650" >Future test</text>
<text x="96" y="524" font-size="20" fill="#C6BA9A" font-weight="400" >Full eligible catalog</text>
<text x="96" y="548" font-size="20" fill="#C6BA9A" font-weight="400" >NDCG, recall, coverage</text>
<text x="30" y="647" font-size="16" fill="#E4BF68" font-weight="700" letter-spacing="1">SEPARATE INTERACTIVE WORKFLOW</text>
