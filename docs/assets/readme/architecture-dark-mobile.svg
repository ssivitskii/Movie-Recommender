<text x="96" y="777" font-size="20" fill="#C6BA9A" font-weight="400" >Small datasets first</text>
<path d="M300 796V810" fill="none" stroke="#E4BF68" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="815" width="540" height="100" rx="12" fill="#333022" stroke="#514830"/>
