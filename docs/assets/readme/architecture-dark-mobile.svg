<text x="96" y="969" font-size="25" fill="#FAF5E5" font-weight="650" >Legacy models</text>
<text x="96" y="997" font-size="20" fill="#C6BA9A" font-weight="400" >SVD / CF / content</text>
<text x="96" y="1021" font-size="20" fill="#C6BA9A" font-weight="400" >Weighted hybrid</text>
<path d="M300 1040V1054" fill="none" stroke="#E4BF68" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="1059" width="540" height="100" rx="12" fill="#333022" stroke="#514830"/>
<text x="51" y="1090" font-size="16" fill="#E4BF68" font-weight="700" >04</text>
<text x="96" y="1091" font-size="25" fill="#FAF5E5" font-weight="650" >CLI / Streamlit</text>
<text x="96" y="1119" font-size="20" fill="#C6BA9A" font-weight="400" >User recommendations</text>
<text x="96" y="1143" font-size="20" fill="#C6BA9A" font-weight="400" >Similar movies</text>
<text x="30" y="1228" font-size="18" fill="#C6BA9A" font-weight="400" >New users use popularity in the benchmark. Offline ranking</text>
<text x="30" y="1252" font-size="18" fill="#C6BA9A" font-weight="400" >metrics do not establish online lift.</text>
