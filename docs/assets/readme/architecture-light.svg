<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Movie Recommender architecture</title>
<desc id="desc">CHRONOLOGICAL BENCHMARK: MovieLens → Time boundaries → Fit &amp; validate → Future test. SEPARATE INTERACTIVE WORKFLOW: MovieLens loader → Python interface → Legacy models → CLI / Streamlit. New users use popularity in the benchmark. Offline ranking metrics do not establish online lift.</desc>
