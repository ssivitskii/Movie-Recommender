<text x="914" y="123" font-size="23" fill="#302B20" font-weight="650" >Future test</text>
<text x="914" y="151" font-size="17" fill="#70644B" font-weight="400" >Full eligible catalog</text>
<text x="914" y="174" font-size="17" fill="#70644B" font-weight="400" >NDCG, recall, coverage</text>
